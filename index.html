<!doctype html>
<html>
  <head>

    <script src="https://cdn.tailwindcss.com"></script>
    <title>mewnator</title>

  <body>
    <video id="video" autoplay playsinline class="absolute  w-full -scale-x-100"></video>

    <p id="score" class="absolute z-20 text-4xl w-full flex justify-center top-[10vh]">0</p>

      <img id="your-face" class="w-[200px] h-[200px]"></img>
      <button id="restart-btn"> play again! </button>
    </div>
    <script type="module" src="src/main.js"></script>
