<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>mewnator</title>
  </head>
  <body>
    <video id="video" autoplay playsinline class="w-full -scale-x-100"></video>
    <canvas id="canvas"></canvas>

    <script type="module">
      const { FaceLandmarker, FilesetResolver, DrawingUtils } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");

      const video = document.getElementById("video");
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      //https://developers.google.com/edge/mediapipe/solutions/vision/face_landmarker/web_js
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");

      const faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
        },
        runningMode: "LIVE_STREAM",
        resultListener: (result) => {
          console.log("got result")
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (result.faceLandmarks.length > 0) {
            for (const point of result.faceLandmarks[0]) {
              ctx.beginPath();
              ctx.arc(point.x * canvas.width, point.y * canvas.height, 1.5, 0, 2 * Math.PI);
              ctx.fillStyle = "lime";
              ctx.fill();
            }
          }
        },
      });

      function predictWebcam() {
        const startTimeMs = performance.now();
        faceLandmarker.detectForVideo(video, startTimeMs);
        requestAnimationFrame(predictWebcam);
      }

      if (video.readyState >= 2) {
        predictWebcam();
      } else {
        video.addEventListener("loadeddata", predictWebcam);
      }

    </script>
  </body>
</html>
